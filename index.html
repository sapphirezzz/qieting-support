    <main class="page">
      <header class="site-header">
        <a class="brand" href="https://sapphirezzz.github.io/qieting-support/">且停 <small>QieTing</small></a>
        <nav class="nav" aria-label="页面导航">

      <p class="eyebrow">QieTing</p>
      <h1>给一天留一点停顿。</h1>
      <p class="lead">且停是一款低打扰的站立与喝水提醒应用。没有成就压力和徽章催促，提醒、统计和偏好默认留在你的设备上。</p>

      <section class="card">
        <h2>需要帮助？</h2>
        <p>请在应用内前往「设置 → 帮助与反馈」提交问题、建议或想要的功能。我们会认真阅读每一条反馈，并尽力把有价值的想法做进后续版本。</p>
        <p><a href="https://sapphirezzz.github.io/qieting-support/support/">查看支持信息</a></p>
      </section>

      <section class="card">
        <h2>隐私优先</h2>
        <p>且停不要求注册账号，也不会主动上传你的提醒计划、记录或统计。仅当你确认提交反馈时，才会发送反馈与所选诊断信息。</p>
        <p><a href="https://sapphirezzz.github.io/qieting-support/privacy/">阅读隐私政策</a></p>
      </section>

      <footer class="footer">© 2026 且停 QieTing</footer>
